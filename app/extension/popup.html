<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
body{font:15px/1.4 system-ui,sans-serif;color:#14213D;margin:0;width:320px}
.wrap{padding:16px;display:flex;flex-direction:column;gap:10px}
h1{font-size:18px;margin:0;display:flex;gap:6px;align-items:center}
input{font:inherit;padding:8px 10px;border:1px solid #D9DCE6;border-radius:8px;width:100%;box-sizing:border-box;font-family:ui-monospace,monospace;font-size:13px}
button{font:inherit;font-weight:700;padding:9px 14px;border-radius:12px;border:2px solid #14213D;background:#D2461C;color:#fff;box-shadow:3px 3px 0 #14213D;cursor:pointer}
button.q{background:#fff;color:#14213D;box-shadow:none;border-width:1px;font-weight:600}
.s{font-size:13px;color:#56607A}.ok{color:#0E7A4D}.bad{color:#C23B3B}
</style></head><body><div class="wrap">
<h1><svg width="16" height="16" viewBox="0 0 20 20"><path d="M10 0 Q10 10 20 10 Q10 10 10 20 Q10 10 0 10 Q10 10 10 0Z" fill="#FF6A3D"/></svg>Margot</h1>
<div id="status" class="s">Checking…</div>
<button id="fill">Fill this application</button>
<details><summary class="s">Pairing code</summary><p class="s">From Margot: Profile, Browser extension.</p><input id="token" placeholder="Paste pairing code"><button class="q" id="save" style="margin-top:8px">Save</button></details>
<p class="s">We fill what we know. You check everything and press submit yourself.</p>
</div><script src="popup.js"></script></body></html>
